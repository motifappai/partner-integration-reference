name: Partner connector
on:
  pull_request:
    paths: ['connector/**', '.github/workflows/connector.yml']
  push:
    tags: ['connector-v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: npm ci --prefix connector
      - run: npm --prefix connector run typecheck
      - run: npm --prefix connector test
      - run: docker compose -f connector/tests/compose.yml up -d --wait
      - run: npm --prefix connector run test:integration
      - run: docker build -t motif-partner-connector:test connector
      - if: always()
        run: docker compose -f connector/tests/compose.yml down -v
  publish:
    if: startsWith(github.ref, 'refs/tags/connector-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: connector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/motifappai/partner-integration-reference:${{ github.ref_name }}
          provenance: true
          sbom: true
